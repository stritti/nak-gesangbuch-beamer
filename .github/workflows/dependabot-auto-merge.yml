name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          compat-lookup: true
      - name: Label
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const name = 'dependencies';

            try {
              await github.rest.issues.getLabel({ owner, repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name,
                color: '0366d6',
                description: 'Pull requests that update a dependency file',
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [name],
            });
      # Approve schlägt fehl, wenn das Repo-Setting „Allow GitHub Actions to
      # create and approve pull requests" deaktiviert ist (Default). Der Merge
      # darf davon nicht blockiert werden — daher continue-on-error.
      - name: Approve
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        continue-on-error: true
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CI-Gate: gh pr merge --auto wartet nur auf *required* Checks. Ohne
      # Branch-Protection (Verify als required) könnte der PR vor/früher als
      # CI mergen — daher explizit auf den Verify-Check des PR-Head warten.
      - name: Wait for CI Verify
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const timeoutMs = 30 * 60 * 1000;
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });
              const verify = data.check_runs.find((c) => c.name === 'Verify');
              if (verify && verify.status === 'completed') {
                if (verify.conclusion === 'success') {
                  console.log(`Verify check passed (${verify.id})`);
                  return;
                }
                core.setFailed(`Verify check concluded with '${verify.conclusion}' — not enabling auto-merge`);
                return;
              }
              console.log('Verify check not completed yet, retrying in 15s...');
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed('Timed out waiting for CI Verify check');
      # --match-head-commit bindet den Merge an den verifizierten Head-SHA:
      # wird der PR nach dem Polling rebased/synchronisiert, mergt Auto-Merge
      # nicht den unverifizierten neuen Head (der nächste synchronize-Run
      # verifiziert den neuen Head und aktiviert Auto-Merge erneut).
      - name: Enable auto-merge
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
