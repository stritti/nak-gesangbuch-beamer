name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dependabot generates commit bodies that are not under our control and
      # can violate commitlint body/footer rules. Keep commitlint enabled for
      # human-authored commits, but do not block dependency updates on bot text.
      - name: Commitlint
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: wagoid/commitlint-github-action@v6
      - run: npm run lint
      # Typecheck ist in npm run build (vue-tsc) enthalten — nicht doppelt ausführen
      - run: npm run test
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.ref == 'refs/heads/main' && '/nak-gesangbuch-beamer/' || '/' }}
